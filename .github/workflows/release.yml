name: release

# Runs when a GitHub release is published (tag v0.1.0 for version 0.1.0): builds the sdist and
# wheel, checks the tag against the version and runs the tests on the wheel, then uploads to PyPI
# through trusted publishing (no API token stored in the repository).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Release tag matches the package version
        run: |
          python -m pip install dist/*.whl
          test "${GITHUB_REF_NAME#v}" = "$(python -c 'import uccap; print(uccap.__version__)')"
      - name: Tests pass on the built wheel
        run: |
          python -m pip install pytest "openpyxl>=3.0" "matplotlib>=3.5"
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
