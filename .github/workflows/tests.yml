name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab, including macOS

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          # Python 3.9 is no longer installed on the newest Ubuntu runner image
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,excel]"
      - run: python -m pytest -q

  oldest-dependencies:
    # the lowest versions declared in pyproject.toml, on the lowest supported Python
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==1.22.4 scipy==1.11.4 pandas==1.5.3 openpyxl==3.0.10 matplotlib==3.5.3 pytest
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests validation examples

  macos:
    # macOS: run on demand only (Actions tab, Run workflow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,excel]"
      - run: python -m pytest -q
